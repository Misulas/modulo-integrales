apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrals-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integrals-mongodb
  template:
    metadata:
      labels:
        app: integrals-mongodb
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: integrals-mongodb
spec:
  selector:
    app: integrals-mongodb
  ports:
    - port: 27017
