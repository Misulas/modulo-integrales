apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrals-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: integrals-rabbitmq
  template:
    metadata:
      labels:
        app: integrals-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: integrals-rabbitmq
spec:
  selector:
    app: integrals-rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: mgmt
      port: 15672
