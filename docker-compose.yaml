services:
  users:
    build: ./users
    ports:
      - "8001:8000"
    volumes:
      - ./users/app:/app/app
    environment:
      MONGODB_URL: mongodb://users-mongodb:27017
    networks:
      - microsvcs

  channels:
    build: ./channels
    ports:
      - "8002:8000"
    volumes:
      - ./channels/app:/app/app
    environment:
      MONGODB_URL: mongodb://channels-mongodb:27017
    networks:
      - microsvcs

  messages:
    build: ./messages
    ports:
      - "8003:8000"
    volumes:
      - ./messages/app:/app/app
    environment:
      USERS_URL: http://users:8000
      CHANNELS_URL: http://channels:8000
      MONGODB_URL: mongodb://messages-mongodb:27017
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microsvcs

  integrals:
    build: ./integrals
    ports:
      - "8004:8000"
    environment:
      MONGODB_URL: mongodb://integrals-mongodb:27017
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      USERS_URL: http://users:8000
      MESSAGES_URL: http://messages:8000
    depends_on:
      rabbitmq:
        condition: service_healthy
      integrals-mongodb:
        condition: service_started
      users:
        condition: service_started
      messages:
        condition: service_started
    networks:
      - microsvcs

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
    networks: [microsvcs]

  users-mongodb:
    image: mongo:7
    volumes: [users-data:/data/db]
    networks: [microsvcs]
  channels-mongodb:
    image: mongo:7
    volumes: [channels-data:/data/db]
    networks: [microsvcs]
  messages-mongodb:
    image: mongo:7
    volumes: [messages-data:/data/db]
    networks: [microsvcs]
  integrals-mongodb:
    image: mongo:7
    volumes: [integrals-data:/data/db]
    networks: [microsvcs]

volumes:
  users-data:
  channels-data:
  messages-data:
  integrals-data:

networks:
  microsvcs:
    name: microsvcs
