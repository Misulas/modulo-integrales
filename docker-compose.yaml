# Stack de integrals. Se une a la red `microsvcs` del chat base
# (users, channels, messages), que se levanta por separado.
services:
  integrals:
    build: ./integrals
    ports:
      - "8004:8000"
    environment:
      MONGODB_URL: mongodb://integrals-mongodb:27017
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      USERS_URL: http://users:8000
      MESSAGES_URL: http://messages:8000
    depends_on:
      rabbitmq:
        condition: service_healthy
      integrals-mongodb:
        condition: service_started
    networks:
      - microsvcs

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
    networks: [microsvcs]

  integrals-mongodb:
    image: mongo:7
    volumes: [integrals-data:/data/db]
    networks: [microsvcs]

volumes:
  integrals-data:

networks:
  microsvcs:
    name: microsvcs
    external: true
